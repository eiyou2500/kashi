    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="48"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.075"/></feComponentTransfer></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
