  </g>
  <g opacity="0.76">
    <circle cx="727" cy="438" r="48" fill="#fffaf2" opacity="0.64"/>
    <circle cx="727" cy="438" r="33" fill="#d9a8a1" opacity="0.32"/>
    <rect x="170" y="482" width="170" height="34" rx="17" fill="#fffaf2" opacity="0.58"/>
    <rect x="620" y="500" width="160" height="20" rx="10" fill="#4a2f27" opacity="0.16"/>
  </g>
  <rect width="960" height="680" rx="44" filter="url(#grain)" opacity="0.55"/>
